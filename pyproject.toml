[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "generador-sprites"
version = "0.1.0"
description = "AI sprite generator: avatar generation + template-based part extraction + animation rendering"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "requests>=2.28",
    "scipy>=1.10",
]

[project.optional-dependencies]
flux = []  # No extra deps, uses HTTP API
gemini = ["google-genai>=1.0"]
rembg = ["rembg>=2.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
all = ["google-genai>=1.0", "rembg>=2.0", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = ["frontend", "research_output", "output", "data", "templates", "docs"]

[project.scripts]
generador-sprites = "generador_sprites.cli:main"
